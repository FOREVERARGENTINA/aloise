<!-- ========== HEADER Y NAVEGACIÓN ========== -->
<header class="header" role="banner">
  <div class="container">
    <div class="header__container">
      <!-- Navegación izquierda -->
      <nav class="nav nav--left" role="navigation" aria-label="Navegación izquierda">
        <ul class="nav__list">
          <li><a href="/propiedades" class="nav__link">Propiedades</a></li>
          <li><a href="/servicios" class="nav__link">Servicios</a></li>
        </ul>
      </nav>

      <!-- Logo centrado -->
      <a href="/" class="header__logo" aria-label="Gabriela Aloise Propiedades - Inicio">
        <img src="/images/logo/favicon.png" alt="Gabriela Aloise Propiedades" class="header__logo-image">
      </a>

      <!-- Navegación derecha -->
      <nav class="nav nav--right" role="navigation" aria-label="Navegación derecha">
        <ul class="nav__list">
          <li><a href="/quienes-somos" class="nav__link">Quiénes somos</a></li>
          <li><a href="/contacto" class="nav__link">Contacto</a></li>
        </ul>
      </nav>

      <!-- Botón menú móvil -->
      <button class="mobile-menu-toggle" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="mobile-menu">
        <span class="mobile-menu-toggle__bar"></span>
        <span class="mobile-menu-toggle__bar"></span>
        <span class="mobile-menu-toggle__bar"></span>
      </button>
    </div>
  </div>
</header>

<!-- Menú Móvil -->
<div class="mobile-menu" id="mobile-menu" role="dialog" aria-modal="true" aria-label="Menú de navegación móvil">
  <!-- Botón de cierre dentro del menú -->
  <button class="mobile-menu-close" aria-label="Cerrar menú de navegación">
    <span class="mobile-menu-close__bar"></span>
    <span class="mobile-menu-close__bar"></span>
  </button>

  <nav role="navigation" aria-label="Navegación móvil">
    <ul class="mobile-menu__list">
      <li class="mobile-menu__item"><a href="/propiedades" class="mobile-menu__link">Propiedades</a></li>
      <li class="mobile-menu__item"><a href="/servicios" class="mobile-menu__link">Servicios</a></li>
      <li class="mobile-menu__item"><a href="/quienes-somos" class="mobile-menu__link">Quiénes somos</a></li>
      <li class="mobile-menu__item"><a href="/contacto" class="mobile-menu__link">Contacto</a></li>
    </ul>
  </nav>
</div>
