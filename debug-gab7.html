<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Debug GAB7</title>
  <style>
    body { font-family: monospace; padding: 2rem; }
    pre { background: #f5f5f5; padding: 1rem; overflow-x: auto; white-space: pre-wrap; }
    .highlight { background: yellow; }
  </style>
</head>
<body>
  <h1>Debug Propiedad GAB7</h1>
  <div id="output"></div>

  <script src="/js/config.js"></script>
  <script src="/js/modules/xintel-api.js"></script>
  <script src="/js/modules/property-renderer.js"></script>

  <script>
    async function debug() {
      const api = new XintelAPI(CONFIG.xintel);
      const renderer = new PropertyRenderer();

      // Obtener la propiedad GAB7 específica
      const result = await api.getPropertyDetail('7');

      if (!result.success) {
        document.getElementById('output').innerHTML = '<p>Error: ' + result.error + '</p>';
        return;
      }

      const prop = result.data;
      console.log('Propiedad GAB7 RAW:', prop);

      const normalized = renderer.normalizeXintelProperty(prop);
      console.log('Propiedad GAB7 NORMALIZADA:', normalized);

      let html = '<h2>Datos RAW de Xintel:</h2><pre>';
      html += `titulo: "<span class="highlight">${prop.titulo}</span>"\n`;
      html += `in_bar: "${prop.in_bar}"\n`;
      html += `in_loc: "${prop.in_loc}"\n`;
      html += `in_cal: "${prop.in_cal}"\n`;
      html += `in_tip: "${prop.in_tip}"\n`;
      html += `in_ope: "${prop.in_ope}"\n`;
      html += `in_amb: "${prop.in_amb}"\n`;
      html += `in_fic: "${prop.in_fic}"\n`;
      html += `in_num: "${prop.in_num}"\n`;
      html += '</pre>';

      html += '<h2>Datos NORMALIZADOS:</h2><pre>';
      html += `title: "<span class="highlight">${normalized.title}</span>"\n`;
      html += `location: "${normalized.location}"\n`;
      html += `property_type: "${normalized.property_type}"\n`;
      html += `operation_type: "${normalized.operation_type}"\n`;
      html += `rooms: ${normalized.rooms}\n`;
      html += '</pre>';

      html += '<h2>Análisis:</h2>';
      const xintelTitle = (prop.titulo || '').trim();
      const isIncomplete = xintelTitle.match(/\sen\s*$/i);
      html += `<p>¿Título termina en "en"? <strong>${isIncomplete ? 'SÍ' : 'NO'}</strong></p>`;
      html += `<p>Título de Xintel: "${xintelTitle}"</p>`;
      html += `<p>¿Está incompleto? <strong>${isIncomplete ? 'SÍ, se usará título construido' : 'NO, se usará título de Xintel'}</strong></p>`;

      document.getElementById('output').innerHTML = html;
    }

    window.addEventListener('load', () => setTimeout(debug, 100));
  </script>
</body>
</html>
