  <script>
    // Inicialización de la página de propiedades
    document.addEventListener('DOMContentLoaded', async () => {
      const propertyService = new PropertyService(CONFIG);
      const renderer = new PropertyRenderer();

      let currentPage = 1;
      let currentFilters = {};

      const locations = [
        // Tres de Febrero
        '3 de Febrero',
        'Tres de Febrero',
        'Caseros',
        'Ciudad Jardín del Palomar',
        'El Palomar',
        'Villa Bosch',
        'Martín Coronado',
        'Pablo Podestá',
        'José Ingenieros',
        'Sáenz Peña',
        'Santos Lugares',
        'Ciudadela',
        'Loma Hermosa',
        'Villa Raffo',
        'Ciudad Jardín',

        // San Martín
        'San Martín',
        'Villa Ballester',
        'San Andrés',
        'Billinghurst',
        'Villa Lynch',

        // Morón
        'Morón',
        'Castelar',
        'Ituzaingó',
        'Haedo',
        'Villa Sarmiento',

        // La Matanza / otros cercanos
        'Ramos Mejía',
        'San Justo',
        'Lomas del Mirador',
        'La Tablada',
        'Isidro Casanova',
        'Ciudad Evita',
        'Villa Madero',
        'Tapiales',
        'Aldo Bonzi',

        // San Miguel
        'San Miguel',
        'Muñiz',
        'Bella Vista',

        // Hurlingham
        'Hurlingham',
        'Villa Tesei',

        // CABA
        'CABA',
        'Capital Federal',
        'Ciudad Autónoma de Buenos Aires'
      ];

      const setupAutocomplete = () => {
        const input = document.getElementById('location');
        const list = document.getElementById('locationAutocomplete');
        const wrapper = input?.closest('.autocomplete-wrapper');
        if (!input || !list || !wrapper) return;

        let activeIndex = -1;

        const closeList = () => {
          list.innerHTML = '';
          list.classList.remove('is-open');
          activeIndex = -1;
        };

        const highlightMatch = (text, query) => {
          const index = text.toLowerCase().indexOf(query.toLowerCase());
          if (index === -1) return text;
          const before = text.slice(0, index);
          const match = text.slice(index, index + query.length);
          const after = text.slice(index + query.length);
          return `${before}<strong>${match}</strong>${after}`;
        };

        const renderList = (items, query) => {
          list.innerHTML = '';
          if (!items.length) {
            closeList();
            return;
          }

          items.forEach((item, index) => {
            const option = document.createElement('div');
            option.className = 'autocomplete-item';
            option.setAttribute('role', 'option');
            option.innerHTML = highlightMatch(item, query);

            option.addEventListener('mousedown', (event) => {
              event.preventDefault();
              input.value = item;
              closeList();
              input.dispatchEvent(new Event('input', { bubbles: true }));
            });

            list.appendChild(option);
            if (index === activeIndex) {
              option.classList.add('is-active');
            }
          });

          list.classList.add('is-open');
        };

        const updateActive = (items) => {
          const options = list.querySelectorAll('.autocomplete-item');
          options.forEach((opt, idx) => {
            opt.classList.toggle('is-active', idx === activeIndex);
          });

          if (activeIndex >= 0 && activeIndex < options.length) {
            options[activeIndex].scrollIntoView({ block: 'nearest' });
          }
        };

        input.addEventListener('input', () => {
          const query = input.value.trim();
          if (!query) {
            closeList();
            return;
          }

          const matches = locations
            .filter((loc) => loc.toLowerCase().includes(query.toLowerCase()))
            .slice(0, 8);

          activeIndex = -1;
          renderList(matches, query);
        });

        input.addEventListener('keydown', (event) => {
          const isOpen = list.classList.contains('is-open');
          if (!isOpen) return;

          const options = list.querySelectorAll('.autocomplete-item');
          if (!options.length) return;

          if (event.key === 'ArrowDown') {
            event.preventDefault();
            activeIndex = (activeIndex + 1) % options.length;
            updateActive(options);
          } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            activeIndex = (activeIndex - 1 + options.length) % options.length;
            updateActive(options);
          } else if (event.key === 'Enter') {
            if (activeIndex >= 0 && activeIndex < options.length) {
              event.preventDefault();
              options[activeIndex].dispatchEvent(new MouseEvent('mousedown'));
            }
          } else if (event.key === 'Escape') {
            closeList();
          }
        });

        document.addEventListener('click', (event) => {
          if (!wrapper.contains(event.target)) {
            closeList();
          }
        });
      };

      const normalizeLocationQuery = (value) => {
        const raw = String(value || '').trim();
        if (!raw) return '';
        const lower = raw.toLowerCase();

        if (lower.includes('3 de febrero') || lower.includes('tres de febrero')) {
          return 'Tres de Febrero';
        }

        if (lower.includes('caba') || lower.includes('capital federal') || lower.includes('ciudad autonoma')) {
          return 'Capital Federal';
        }

        return raw;
      };

      const matchesLocation = (property, query) => {
        if (!query) return true;
        const q = query.toLowerCase();
        const candidates = [
          property?.in_bar,
          property?.in_loc,
          property?.barrio,
          property?.localidad,
          property?.location,
          property?.direccion
        ]
          .filter(Boolean)
          .map((val) => String(val).toLowerCase());

        return candidates.some((text) => text.includes(q)) || q.includes('tres de febrero') && candidates.some((text) => text.includes('3 de febrero'));
      };

      const parseBedrooms = (property) => {
        const rawValue =
          property?.bedrooms ??
          property?._xintel?.ti_dor ??
          property?._xintel?.cantidad_dormitorios ??
          property?.ti_dor ??
          property?.cantidad_dormitorios;

        const numeric = parseInt(String(rawValue ?? '').replace(/[^\d]/g, ''), 10);
        return Number.isFinite(numeric) ? numeric : 0;
      };

      const matchesBedrooms = (property, selectedValue) => {
        if (!selectedValue) return true;

        const bedrooms = parseBedrooms(property);

        if (selectedValue === '0') return bedrooms === 0;
        if (selectedValue === '5plus') return bedrooms >= 5;

        const expectedBedrooms = Number(selectedValue);
        return Number.isFinite(expectedBedrooms) ? bedrooms === expectedBedrooms : true;
      };

      const sortProperties = (items = [], sortKey = 'date_desc') => {
        const sorted = [...items];
        const exchangeRate = CONFIG?.currencies?.exchangeRate || 1500;

        const toNumber = (value) => {
          if (value === undefined || value === null || value === '') return 0;
          const normalized = typeof value === 'string'
            ? value.replace(/[^\d.-]/g, '')
            : value;
          const num = Number(normalized);
          return Number.isFinite(num) ? num : 0;
        };

        const detectCurrency = (item) => {
          const moneda = String(item?.currency || item?.moneda || item?.in_mon || '').toUpperCase();
          if (moneda.includes('USD') || moneda.includes('U$S') || moneda === 'U' || moneda === 'D') return 'USD';
          if (moneda.includes('ARS') || moneda === 'P') return 'ARS';
          if (moneda === '$') return 'ARS';

          const operation = (item?.operation_type || item?.operacion || item?.in_ope || '').toString().toLowerCase();
          if (operation.includes('alquiler') || operation === 'a' || operation === 't') return 'ARS';
          if (operation.includes('venta') || operation === 'v' || operation === 'm') return 'USD';

          return null;
        };

        const parsePriceValue = (item) => {
          if (item?.price !== undefined && item?.price !== null) return toNumber(item.price);
          if (item?.precio !== undefined && item?.precio !== null) return toNumber(item.precio);
          if (item?.valor !== undefined && item?.valor !== null) return toNumber(item.valor);

          if (item?.in_ope === 'A' || item?.in_ope === 'T') {
            return toNumber(item?.in_vaa);
          }

          if (item?.in_vlu !== undefined && item?.in_vlu !== null && item?.in_vlu !== '') {
            return toNumber(item.in_vlu);
          }

          if (item?.in_val !== undefined && item?.in_val !== null && item?.in_val !== '') {
            return toNumber(item.in_val);
          }

          return toNumber(item?.valor_extra);
        };

        const getPrice = (item) => {
          const raw = parsePriceValue(item);
          const currency = detectCurrency(item);
          if (currency === 'USD') return raw * exchangeRate;
          return raw;
        };

        const getDate = (item) => (Number.isFinite(item.listingDate) ? item.listingDate : 0);

        switch (sortKey) {
          case 'price_asc':
            sorted.sort((a, b) => getPrice(a) - getPrice(b));
            break;
          case 'price_desc':
            sorted.sort((a, b) => getPrice(b) - getPrice(a));
            break;
          case 'date_desc':
          default:
            sorted.sort((a, b) => getDate(b) - getDate(a));
            break;
        }

        return sorted;
      };

      // Función para cargar propiedades
      async function loadProperties() {
        // Mostrar loading
        renderer.renderLoadingState('#propertiesGrid');

        // Obtener filtros del formulario
        const formData = new FormData(document.getElementById('filtersForm'));
        const rawLocation = formData.get('location') || '';
        const normalizedLocation = normalizeLocationQuery(rawLocation);

        currentFilters = {
          operationType: formData.get('operationType') || undefined,
          propertyType: formData.get('propertyType') || undefined,
          location: normalizedLocation || undefined,
          bedrooms: formData.get('bedrooms') || undefined,
          sort: document.getElementById('sortBy').value || 'date_desc',
          page: currentPage,
          limit: formData.get('bedrooms') ? 120 : CONFIG.xintel.defaultFilters.limit
        };

        // Obtener propiedades (primero con filtro directo)
        let result = await propertyService.getProperties(currentFilters);

        if (!result.success) {
          renderer.renderErrorState('#propertiesGrid', result.error);
          return;
        }

        let { properties, pagination } = result.data;

        // Fallback: si la API no devuelve resultados con ubicación, reintentar sin filtro y filtrar localmente
        if (normalizedLocation && properties.length === 0) {
          const fallbackFilters = { ...currentFilters };
          delete fallbackFilters.location;
          fallbackFilters.page = 1;
          result = await propertyService.getProperties(fallbackFilters);
          if (result.success) {
            properties = result.data.properties || [];
            const fallbackFiltered = properties.filter((item) => matchesLocation(item, normalizedLocation));
            properties = fallbackFiltered;
            pagination = {
              current_page: 1,
              total_pages: 1,
              total_items: fallbackFiltered.length,
              items_per_page: fallbackFiltered.length || 0
            };
          }
        }

        const normalizedProperties = properties.map((item) => renderer.normalizeXintelProperty(item));
        const filteredProperties = normalizedProperties.filter((item) => {
          const matchesSelectedLocation = normalizedLocation ? matchesLocation(item, normalizedLocation) : true;
          const matchesSelectedBedrooms = matchesBedrooms(item, currentFilters.bedrooms);
          return matchesSelectedLocation && matchesSelectedBedrooms;
        });
        const sortedProperties = sortProperties(filteredProperties, currentFilters.sort);

        // Renderizar propiedades
        renderer.renderPropertiesGrid(sortedProperties, '#propertiesGrid');

        // Actualizar contador de resultados
        const resultsCount = document.getElementById('resultsCount');
        if (pagination) {
          const usingLocalExactFilters = Boolean(normalizedLocation || currentFilters.bedrooms);
          const effectivePagination = usingLocalExactFilters
            ? {
                current_page: 1,
                total_pages: 1,
                total_items: sortedProperties.length,
                items_per_page: sortedProperties.length || 0
              }
            : pagination;

          resultsCount.innerHTML = `
            Mostrando <strong>${sortedProperties.length}</strong> de <strong>${effectivePagination.total_items}</strong> propiedades
            ${result.mock ? '<span style="color: var(--color-warning); margin-left: 8px;">(Datos de prueba)</span>' : ''}
          `;

          // Renderizar paginación
          if (effectivePagination.total_pages > 1) {
            const paginationHTML = renderer.renderPagination(
              effectivePagination.current_page,
              effectivePagination.total_pages,
              'goToPage'
            );
            document.getElementById('pagination').innerHTML = paginationHTML;
          } else {
            document.getElementById('pagination').innerHTML = '';
          }
        }

        // Scroll to top solo cuando cambia de página (no en carga inicial o filtros)
        if (currentPage > 1) {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      // Handler de búsqueda
      document.getElementById('filtersForm').addEventListener('submit', (e) => {
        e.preventDefault();
        currentPage = 1;
        loadProperties().then(() => {
          const resultsSection = document.getElementById('results');
          if (resultsSection) {
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      });

      // Handler de limpiar filtros
      document.getElementById('clearFilters').addEventListener('click', () => {
        document.getElementById('filtersForm').reset();
        currentPage = 1;
        loadProperties();
      });

      // Handler de ordenamiento
      document.getElementById('sortBy').addEventListener('change', () => {
        currentPage = 1;
        loadProperties();
      });

      // Función global para paginación
      window.goToPage = (page) => {
        currentPage = page;
        loadProperties();
      };

      // Autocompletado de ubicación
      setupAutocomplete();

      // Cargar propiedades inicialmente
      loadProperties();

      // Log de estado de la API
      const apiStatus = propertyService.getAPIStatus();
      if (apiStatus.useMockData) {
        console.log('âš ï¸ Usando datos de prueba. Configurá la API de Xintel en js/config.js');
      }
    });
  </script>
  <!-- Components: carga navbar y footer -->
  <script src="/js/components.js" defer></script>
  <!-- Scroll to top: muestra el botón al hacer scroll -->
  <script>
    (function () {
      var btn = document.querySelector('.scroll-top');
      if (!btn) return;
      window.addEventListener('scroll', function () {
        btn.classList.toggle('is-visible', window.scrollY > 300);
      }, { passive: true });
    })();
  </script>
  <!-- Loader: descarta el overlay -->
  <script src="/js/loader.js"></script>
</body>
