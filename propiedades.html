  <style>
    /* Estilos específicos para filtros (más compactos) */
    .filters {
      background-color: var(--color-gray-50);
      padding: var(--space-sm);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-md);
    }

    .filters__grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-xs);
    }

    @media (min-width: 640px) {
      .filters__grid {
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-sm);
      }
    }

    @media (min-width: 1024px) {
      .filters__grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* Compactar controles dentro de filtros */
    .filters .form-group { margin-bottom: var(--space-xs); }
    .filters .form-label { font-size: 0.88rem; margin-bottom: calc(var(--space-0xs) + 2px); display: block; }
    .filters .form-input, .filters .form-select {
      padding: 6px 8px;
      height: 38px;
      font-size: 0.95rem;
    }

    .filters__actions {
      display: flex;
      gap: var(--space-xs);
      margin-top: var(--space-xs);
      flex-wrap: wrap;
    }

    .filters__actions .btn {
      padding: 8px 10px;
      font-size: 0.95rem;
      min-height: 36px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-xl);
      flex-wrap: wrap;
      gap: var(--space-md);
    }

    .results-count {
      font-size: var(--font-size-lg);
      color: var(--color-gray-700);
    }

    .results-count strong {
      color: var(--color-primary);
      font-weight: var(--font-weight-bold);
    }
  </style>
</head>

  <!-- JavaScript específico de esta página -->
  <script>
    // Inicialización de la página de propiedades
    document.addEventListener('DOMContentLoaded', async () => {
      const propertyService = new PropertyService(CONFIG);
      const renderer = new PropertyRenderer();

      let currentPage = 1;
      let currentFilters = {};

      // Función para cargar propiedades
      async function loadProperties() {
        // Mostrar loading
        renderer.renderLoadingState('#propertiesGrid');

        // Obtener filtros del formulario
        const formData = new FormData(document.getElementById('filtersForm'));
        currentFilters = {
          operationType: formData.get('operationType') || undefined,
          propertyType: formData.get('propertyType') || undefined,
          location: formData.get('location') || undefined,
          minRooms: formData.get('minRooms') ? parseInt(formData.get('minRooms')) : undefined,
          sort: document.getElementById('sortBy').value || 'date_desc',
          page: currentPage,
          limit: CONFIG.xintel.defaultFilters.limit
        };

        // Obtener propiedades
        const result = await propertyService.getProperties(currentFilters);

        if (!result.success) {
          renderer.renderErrorState('#propertiesGrid', result.error);
          return;
        }

        const { properties, pagination } = result.data;

        // Renderizar propiedades
        renderer.renderPropertiesGrid(properties, '#propertiesGrid');

        // Actualizar contador de resultados
        const resultsCount = document.getElementById('resultsCount');
        if (pagination) {
          resultsCount.innerHTML = `
            Mostrando <strong>${properties.length}</strong> de <strong>${pagination.total_items}</strong> propiedades
            ${result.mock ? '<span style="color: var(--color-warning); margin-left: 8px;">(Datos de prueba)</span>' : ''}
          `;

          // Renderizar paginación
          if (pagination.total_pages > 1) {
            const paginationHTML = renderer.renderPagination(
              pagination.current_page,
              pagination.total_pages,
              'goToPage'
            );
            document.getElementById('pagination').innerHTML = paginationHTML;
          } else {
            document.getElementById('pagination').innerHTML = '';
          }
        }

        // Scroll to top solo cuando cambia de página (no en carga inicial o filtros)
        if (currentPage > 1) {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      // Handler de búsqueda
      document.getElementById('filtersForm').addEventListener('submit', (e) => {
        e.preventDefault();
        currentPage = 1;
        loadProperties();
      });

      // Handler de limpiar filtros
      document.getElementById('clearFilters').addEventListener('click', () => {
        document.getElementById('filtersForm').reset();
        currentPage = 1;
        loadProperties();
      });

      // Handler de ordenamiento
      document.getElementById('sortBy').addEventListener('change', () => {
        currentPage = 1;
        loadProperties();
      });

      // Función global para paginación
      window.goToPage = (page) => {
        currentPage = page;
        loadProperties();
      };

      // Cargar propiedades inicialmente
      loadProperties();

      // Log de estado de la API
      const apiStatus = propertyService.getAPIStatus();
      if (apiStatus.useMockData) {
        console.log('⚠️ Usando datos de prueba. Configurá la API de Xintel en js/config.js');
      }
    });
  </script>
